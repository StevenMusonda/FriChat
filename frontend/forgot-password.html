<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FriChat - Forgot Password</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="icons/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FriChat">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <!--  <script src="js/protect.js"></script>  -->
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FriChat</h1>
                <p>Forgot your password? Enter your email and we'll send you a reset link.</p>
            </div>

            <form id="forgotForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="Enter your account email"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <span class="btn-text">Send Reset Link</span>
                        <span class="btn-loader" style="display: none;">Sending...</span>
                    </button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>

            <div class="auth-footer">
                <p>Remembered it? <a href="login.html">Back to login</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const forgotForm = document.getElementById('forgotForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            forgotForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();

                // Show loading state
                submitBtn.disabled = true;
                submitBtn.querySelector('.btn-text').style.display = 'none';
                submitBtn.querySelector('.btn-loader').style.display = 'inline';
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';

                try {
                    const result = await requestPasswordReset(email);

                    if (result.success) {
                        successMessage.textContent = result.message;
                        successMessage.style.display = 'block';
                        forgotForm.reset();
                    } else {
                        errorMessage.textContent = (result.errors && result.errors[0].msg) || result.message || 'Failed to send reset link';
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    errorMessage.textContent = 'An error occurred. Please try again.';
                    errorMessage.style.display = 'block';
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.querySelector('.btn-text').style.display = 'inline';
                    submitBtn.querySelector('.btn-loader').style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
