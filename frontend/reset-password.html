<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Keep the reset token out of Referer headers -->
    <meta name="referrer" content="no-referrer">
    <title>FriChat - Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
    <!--  <script src="js/protect.js"></script>  -->
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FriChat</h1>
                <p>Choose a new password for your account.</p>
            </div>

            <form id="resetForm" class="auth-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="6"
                        placeholder="At least 6 characters"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        minlength="6"
                        placeholder="Re-enter your new password"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="resetBtn">
                        <span class="btn-text">Reset Password</span>
                        <span class="btn-loader" style="display: none;">Resetting...</span>
                    </button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
            </form>

            <div class="auth-footer">
                <p><a href="login.html">Back to login</a> · <a href="forgot-password.html">Request a new link</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resetForm = document.getElementById('resetForm');
            const resetBtn = document.getElementById('resetBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            const token = new URLSearchParams(window.location.search).get('token');

            // Remove the token from the address bar and browser history
            if (token) {
                window.history.replaceState(null, '', window.location.pathname);
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
            }

            if (!token) {
                showError('This reset link is invalid. Please request a new one.');
                resetBtn.disabled = true;
                return;
            }

            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                errorMessage.style.display = 'none';

                if (password !== confirmPassword) {
                    showError('Passwords do not match');
                    return;
                }

                // Show loading state
                resetBtn.disabled = true;
                resetBtn.querySelector('.btn-text').style.display = 'none';
                resetBtn.querySelector('.btn-loader').style.display = 'inline';

                try {
                    const result = await resetPassword(token, password);

                    if (result.success) {
                        successMessage.textContent = result.message + ' Redirecting to login...';
                        successMessage.style.display = 'block';
                        resetForm.querySelectorAll('input').forEach(input => input.disabled = true);
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2500);
                        return;
                    }

                    showError((result.errors && result.errors[0].msg) || result.message || 'Failed to reset password');
                } catch (error) {
                    showError('An error occurred. Please try again.');
                }

                resetBtn.disabled = false;
                resetBtn.querySelector('.btn-text').style.display = 'inline';
                resetBtn.querySelector('.btn-loader').style.display = 'none';
            });
        });
    </script>
</body>
</html>
