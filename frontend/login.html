<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FriChat - Login</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a202c" media="(prefers-color-scheme: dark)">
    <link rel="icon" href="icons/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FriChat">
    <script src="js/pwa.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
    <!--  <script src="js/protect.js"></script>  -->
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>FriChat</h1>
                <p>Welcome back! Please login to your account.</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required 
                        placeholder="Enter your username or email"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                    <a href="forgot-password.html" class="forgot-password-link">Forgot password?</a>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <span class="btn-text">Login</span>
                        <span class="btn-loader" style="display: none;">Logging in...</span>
                    </button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </form>

            <!-- Second step, when the account has two-factor authentication on -->
            <form id="twoFactorForm" class="auth-form" hidden>
                <div class="form-group">
                    <label for="twoFactorCode" id="twoFactorLabel">Code from your authenticator app</label>
                    <input
                        type="text"
                        id="twoFactorCode"
                        name="twoFactorCode"
                        required
                        maxlength="32"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="6-digit code"
                    >
                    <button type="button" class="link-button forgot-password-link" id="twoFactorToggle">Use a recovery code instead</button>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary" id="twoFactorBtn">Verify</button>
                </div>

                <div id="twoFactorError" class="error-message" style="display: none;" role="alert"></div>

                <button type="button" class="link-button forgot-password-link" id="twoFactorBack">Back to sign in</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Initialize login form
        document.addEventListener('DOMContentLoaded', () => {
            // After login, go back to an invite link if one sent us here (validated, same site only)
            const nextUrl = getSafeNextUrl();

            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');

            // Sent here because the session ended (auth.js adds ?signedOut=<reason>)
            const signedOut = new URLSearchParams(window.location.search).get('signedOut');
            const SIGNED_OUT_MESSAGES = {
                revoked: 'You were signed out of this device. Please sign in again.',
                security: 'For your security, this sign-in was ended. Please sign in again.',
                expired: 'Your session expired. Please sign in again.',
                suspended: 'This account has been suspended.',
                deletion: 'Your account will be deleted in 14 days. Sign in before then to cancel.'
            };
            if (SIGNED_OUT_MESSAGES[signedOut]) {
                errorMessage.textContent = SIGNED_OUT_MESSAGES[signedOut];
                errorMessage.style.display = 'block';
            } else if (isAuthenticated()) {
                // Signed in on this browser (chat.html confirms it with the server)
                window.location.href = nextUrl || 'chat.html';
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Show loading state
                loginBtn.disabled = true;
                loginBtn.querySelector('.btn-text').style.display = 'none';
                loginBtn.querySelector('.btn-loader').style.display = 'inline';
                errorMessage.style.display = 'none';

                try {
                    const result = await login(username, password);
                    
                    if (result.success && result.data.twoFactorRequired) {
                        showTwoFactorStep(result.data.challengeToken);
                    } else if (result.success) {
                        // Redirect to chat (or back to the invite link)
                        window.location.href = nextUrl || 'chat.html';
                    } else {
                        errorMessage.textContent = result.message || 'Login failed';
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    errorMessage.textContent = 'An error occurred. Please try again.';
                    errorMessage.style.display = 'block';
                } finally {
                    // Reset button state
                    loginBtn.disabled = false;
                    loginBtn.querySelector('.btn-text').style.display = 'inline';
                    loginBtn.querySelector('.btn-loader').style.display = 'none';
                }
            });

            // ===== Two-factor step =====

            const twoFactorForm = document.getElementById('twoFactorForm');
            const twoFactorCode = document.getElementById('twoFactorCode');
            const twoFactorError = document.getElementById('twoFactorError');
            const twoFactorBtn = document.getElementById('twoFactorBtn');
            const twoFactorToggle = document.getElementById('twoFactorToggle');
            let challengeToken = null;
            let usingRecoveryCode = false;

            function showTwoFactorError(text) {
                twoFactorError.textContent = text;
                twoFactorError.style.display = text ? 'block' : 'none';
            }

            function setRecoveryMode(on) {
                usingRecoveryCode = on;
                twoFactorCode.value = '';
                twoFactorCode.inputMode = on ? 'text' : 'numeric';
                twoFactorCode.placeholder = on ? 'XXXX-XXXX-XXXX-XXXX' : '6-digit code';
                document.getElementById('twoFactorLabel').textContent = on ? 'Recovery code' : 'Code from your authenticator app';
                twoFactorToggle.textContent = on ? 'Use your authenticator app' : 'Use a recovery code instead';
                twoFactorCode.focus();
            }

            function showTwoFactorStep(token) {
                challengeToken = token;
                document.getElementById('password').value = '';
                loginForm.hidden = true;
                twoFactorForm.hidden = false;
                showTwoFactorError('');
                setRecoveryMode(false);
            }

            function backToPassword() {
                challengeToken = null;
                twoFactorForm.hidden = true;
                loginForm.hidden = false;
                document.getElementById('password').focus();
            }

            twoFactorToggle.addEventListener('click', () => setRecoveryMode(!usingRecoveryCode));
            document.getElementById('twoFactorBack').addEventListener('click', backToPassword);

            twoFactorForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                twoFactorBtn.disabled = true;
                showTwoFactorError('');

                const result = await verifyTwoFactorLogin(challengeToken, twoFactorCode.value);
                twoFactorBtn.disabled = false;

                if (result.success) {
                    window.location.href = nextUrl || 'chat.html';
                } else if (result.code === 'CHALLENGE_EXPIRED') {
                    backToPassword();
                    errorMessage.textContent = result.message;
                    errorMessage.style.display = 'block';
                } else {
                    twoFactorCode.value = '';
                    twoFactorCode.focus();
                    showTwoFactorError((result.errors && result.errors[0] && result.errors[0].msg) || result.message || 'That code didn\'t work');
                }
            });
        });
    </script>
</body>
</html>
